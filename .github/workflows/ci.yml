name: CI

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm lint

      - name: Run TypeScript type check
        run: pnpm type-check

  build-check:
    name: Build Check
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    env:
      # ── Stub values for build-time env validation ONLY ──────────────────────
      # These are NOT real credentials. They satisfy src/env.ts's Zod schema
      # so `next build` completes. Real credentials live in GitHub Secrets.
      # See Task 0.4 for how to add those.
      DATABASE_URL: "postgresql://stub:stub@localhost:5432/stub?pgbouncer=true&connection_limit=1"
      DIRECT_URL: "postgresql://stub:stub@localhost:5432/stub"
      AUTH_SECRET: "stub-secret-for-build-check-32-chars-min"
      AUTH_URL: "http://localhost:3000"
      NVIDIA_API_KEY: "nvapi-stub-build-check-only"
      UPSTASH_REDIS_REST_URL: "https://stub.upstash.io"
      UPSTASH_REDIS_REST_TOKEN: "stub-token-build-check"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
      # Skip @t3-oss/env-nextjs Zod validation — stubs won't pass strict checks
      SKIP_ENV_VALIDATION: "true"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Next.js app
        run: pnpm build
